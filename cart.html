<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Демо-корзина — Dark Flowers</title>
    <link rel="icon" href="assets/mark.svg" type="image/svg+xml" />

    <style>
      :root {
        --bg: #0f0f10;
        --card: #1e1e1f;
        --muted: #bdbdbd;
        --accent: #6b0f17;
        --accent-2: #9e2b37;
        --green: #4caf50;
        --silver: #bfbfc1;
        --radius: 10px;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: linear-gradient(180deg, #080808 0%, #0f0f12 100%);
        color: #fff;
        font-family: Inter, Arial, sans-serif;
      }
      header {
        background: transparent;
        padding: 18px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        color: var(--silver);
      }
      main {
        max-width: 1100px;
        margin: 30px auto;
        padding: 20px;
      }
      .panel {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02),
          rgba(255, 255, 255, 0.01)
        );
        border-radius: 12px;
        padding: 20px;
        border: 1px solid rgba(255, 255, 255, 0.03);
      }
      h1 {
        margin: 0 0 10px 0;
        color: var(--silver);
      }
      .cart-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 14px;
      }
      .item {
        display: flex;
        gap: 12px;
        align-items: center;
        border-radius: 10px;
        padding: 10px;
        background: rgba(0, 0, 0, 0.3);
      }
      .item-img {
        width: 92px;
        height: 70px;
        flex: 0 0 92px;
        border-radius: 8px;
        overflow: hidden;
      }
      .item-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .item-info {
        flex: 1;
      }
      .item-title {
        font-weight: 700;
        color: var(--silver);
      }
      .item-price {
        color: #fff;
        margin-top: 6px;
        font-weight: 700;
      }
      .item-controls {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: flex-end;
      }
      .qty {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .qty button {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.06);
        color: var(--muted);
        padding: 6px 8px;
        border-radius: 8px;
        cursor: pointer;
      }
      .qty span {
        min-width: 28px;
        text-align: center;
        display: inline-block;
      }
      .remove {
        background: transparent;
        border: none;
        color: #ff6b6b;
        cursor: pointer;
      }
      .totals {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 18px;
        border-top: 1px dashed rgba(255, 255, 255, 0.04);
        padding-top: 14px;
      }
      .actions {
        display: flex;
        gap: 12px;
      }
      .btn {
        padding: 10px 14px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        font-weight: 700;
      }
      .btn-secondary {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.06);
        color: var(--muted);
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .empty {
        color: var(--muted);
        padding: 40px;
        text-align: center;
      }
      @media (max-width: 700px) {
        .item {
          flex-direction: column;
          align-items: flex-start;
        }
        .item-controls {
          align-self: stretch;
          flex-direction: row;
          justify-content: space-between;
          width: 100%;
        }
      }
      * { box-sizing: border-box; }
      header { gap: 16px; flex-wrap: wrap; }
      h1 { font-size: 24px; }
      .item-info { min-width: 0; overflow-wrap: anywhere; }
      .totals, .actions { flex-wrap: wrap; gap: 12px; }
      .demo-notice, #checkoutSummary { color: #dfc6ce; line-height: 1.6; }
      :where(button,a):focus-visible { outline: 3px solid #dfacbb; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        <span
          style="
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: inline-block;
            margin-right: 10px;
          "
        ></span
        >Dark Flowers
      </div>
      <nav>
        <a href="index.html" style="color: var(--muted); text-decoration: none"
          >← Вернуться в каталог</a
        >
      </nav>
    </header>

    <main>
      <div class="panel">
        <h1>Ваша корзина</h1>
        <p class="demo-notice">Демонстрация: корзина хранится в браузере. Заказы никуда не отправляются, оплата недоступна.</p>
        <p id="storageNotice" role="alert" hidden></p>
        <p id="checkoutSummary" role="status" hidden></p>
        <div id="cartContainer" class="cart-list"></div>

        <div id="emptyMessage" class="empty" style="display: none">
          Ваша корзина пуста.
        </div>

        <div class="totals" style="display: none" id="totalsBlock">
          <div style="font-weight: 700">
            Итого: <span id="totalCount">0</span> товара(ов)
          </div>
          <div style="text-align: right">
            <div style="font-size: 18px; font-weight: 800" id="totalPrice">
              0 ₸
            </div>
            <div class="actions" style="margin-top: 8px">
              <button class="btn btn-secondary" id="clearCart">
                Очистить корзину
              </button>
              <button class="btn btn-primary" id="checkoutBtn">
                Посмотреть демо-итог
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer
      style="
        padding: 18px;
        text-align: center;
        color: var(--muted);
        border-top: 1px solid rgba(255, 255, 255, 0.03);
      "
    >
      Dark Flowers — учебная статическая витрина
    </footer>
    <script src="cart-store.js"></script>
    <script src="cart.js"></script>
      
  </body>
</html>
